[mod]
id = "wardrobe"
name = "Wardrobe"
version = "0.1.0"
description = "Recolour Recette by region — hair, eyes, skin, shirt, top, tie, apron, skirt, hair bobbles, boots & belt — everywhere she appears (field sprite, portraits, the kneeling chibi, the pause art). Presets or your own #RRGGBB per region, live from a Wardrobe page in the pause / title Options. Masks are built on your PC from your own game files at load, from shipped colour rules: no pixels shipped."
authors = ["openrecet"]
target_games = ["recettear_steam_en_1108"]
# textures only (the loader's load-time transform): the game never reads them back
render_only = true

[loader]
api = "1.8"

[config.preset]
type = "string"
default = "Original"
label = "Preset (Original, a palettes.txt name, or Custom)"

[config.hair]
type = "string"
default = ""
label = "hair colour (#RRGGBB; empty = original; used when preset = Custom)"

[config.eyes]
type = "string"
default = ""
label = "eyes colour (#RRGGBB; empty = original; used when preset = Custom)"

[config.skin]
type = "string"
default = ""
label = "skin colour (#RRGGBB; empty = original; used when preset = Custom)"

[config.shirt]
